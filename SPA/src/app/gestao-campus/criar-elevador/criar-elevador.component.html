<html>
  <body>
    <div class="sidebar">
      <app-sidebarGestaoCampus></app-sidebarGestaoCampus>
    </div>
    <div class="header">
      <h1>Criar elevador</h1>
    </div>
    <div class="conteudo">
      <div class = "input-field">
        <select id="codigo" name="codigo" #codigo required>
          <option value="" disabled selected>Codigo Edificio *</option>
          <option *ngFor="let option of listaCodEd" [value]="option">{{ option }}</option>
        </select>
      </div>

      <div class="input-field">
        <div class="multiselect">
          <ng-multiselect-dropdown [placeholder]="'Pisos servidos (mínimo 2)* '" [settings]="dropdownSettings" [data]="pisosEd">
          </ng-multiselect-dropdown>
        </div>
      </div>

      <div class = "input-field"> 
        <input name="marca" #marca placeholder="Marca" />
      </div>

      <div class = "input-field"> 
        <input name="modelo" #modelo placeholder="Modelo" />
      </div>

      <div class = "input-field">
        <input name="numeroSerie" #numeroSerie placeholder="Número de série"/>
      </div>

      <div class = "input-field">
        <input name="descricao" #descricao placeholder="Descrição"/>
      </div>

      <div class = "button-submit">
        <button type="button" class="add-button" >Criar Elevador</button>
      </div>
      <app-message></app-message>
    </div>
  </body>
  
</html>

<html>
  <body>
    <div class="sidebar">
      <app-sidebarGestaoCampus></app-sidebarGestaoCampus>
    </div>
    <div class="conteudo">
      <div class = "input-field"> 
        <input name="codigo" #codigo placeholder="Código Edifício *" />
        <span></span>
      </div>

      <div class = "input-field">
        <input type="number" name="numeroPiso" #numeroPiso placeholder="Numero do Piso *"/>
        <span></span>
      </div>

      <div class = "input-field"> 
        <input name="descricaoPiso" #descricaoPiso placeholder="Descrição do Piso" />
        <span></span>
      </div>

      <div class = "button-submit">
        <button type="button" class="add-button" (click)="add(codigo.value, +numeroPiso.value, descricaoPiso.value);">Criar Piso</button>
      </div>
    </div>
    <div class="message">
      <app-message></app-message>
    </div>
  </body>
</html>

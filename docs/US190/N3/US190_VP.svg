ng" textLength="14" x="132" y="544.8936">16</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50" x="150" y="544.8936">resposta</text><!--MD5=[e3a8672e40c8415308f32c523dfbda1e]
@startuml
autonumber

participant RoutePiso as route
participant "dto: criarPisoDTO" as dto
participant "controller: pisoController" as ctrl
participant "service: criarPisoService" as service
participant "edificioRepo" as edRepo
participant "edicio" as edificio
participant "pisoRepo" as pisoRepo
participant "piso" as piso


[o-> route: POST(json)
activate route
route -> dto ** : create(json)
route -> ctrl: criarPiso(criarPisoDTO)
activate ctrl
ctrl -> service: criarPiso(criarPisoDTO) 
activate service
service -> edRepo: findByDomain(codigo)
activate edRepo
return edificio
service -> edicio :  verificaSePisoJaExiste(nPiso)
activate edicio
return flag
service -> pisoRepo: maxID()
activate pisoRepo
return maxId
service -> piso ** : create(idPiso, nPiso, descricao)
service -> edicio: addPiso(piso)
service -> pisoRepo: save(piso)
service -> edicio: save(edificio)
return resposta
return resposta













@enduml


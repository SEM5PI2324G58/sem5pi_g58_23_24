:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="5" x2="111" y1="605.4531" y2="605.4531"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="17" y="600.5967">17</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="17" x="35" y="600.5967">Ok</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="3" x2="166.5" y1="614.4531" y2="614.4531"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="41" x="8" y="625.8721">["Erro"]</text><polygon fill="#181818" points="11,647.6406,1,651.6406,11,655.6406,7,651.6406" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="5" x2="111" y1="651.6406" y2="651.6406"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="17" y="646.7842">18</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24" x="35" y="646.7842">Erro</text><!--MD5=[d1f404cb3032b6c7df151a4cec810d97]
@startuml
autonumber

participant RoutePiso as route
participant "dto: CriarPisoDTO" as dto
participant "controller: PisoController" as ctrl
participant "service: CriarPisoService" as service
participant "EdificioRepo" as edRepo
participant "Edificio" as edificio
participant "PisoRepo" as pisoRepo
participant "Piso" as piso


[o-> route: POST(json)
activate route
route -> dto ** : create(json)
route -> ctrl: criarPiso(criarPisoDTO)
activate ctrl
ctrl -> service: criarPiso(criarPisoDTO) 
activate service
service -> edRepo: findByDomain(codigo)
activate edRepo
return edificio
service -> edificio :  verificaSePisoJaExiste(nPiso)
activate edificio
return flag
service -> pisoRepo: maxID()
activate pisoRepo
return maxId
service -> piso ** : create(idPiso, nPiso, descricao, comprimento, largura)
service -> edificio: addPiso(piso)
service -> pisoRepo: save(piso)
service -> edRepo: save(edificio)
return resposta
return resposta
alt
<- - route: Ok
else "Erro"
<- - route: Erro
end alt














@enduml


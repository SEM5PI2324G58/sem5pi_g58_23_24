@startuml
autonumber

actor ator 
participant "SistemaRobDroneGo" as sistema <<System (C4)>>

ator -> sistema: recebe informação de edição (edificio, pisosServidos, xCoord, yCoord, orientacao,\n marca, modelo, numeroSerie, descricao)
activate sistema
return resposta

 
@enduml


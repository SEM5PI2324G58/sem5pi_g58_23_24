@startuml
autonumber

participant MDRoboISEP as md <<Container (C4)>>
participant SGBD as sgbd <<Container (C4)>>

[o-> md: criar edifício e insere a informação(descricao, nome, codigo,dimensao)
activate md
md -> sgbd: findByDomainId(codigo)
activate sgbd
return null
md -> sgbd: save(edificio)
activate sgbd
return sucesso
alt
<- - md: OK
else "Erro"
<- - md: Erro
end alt
@enduml


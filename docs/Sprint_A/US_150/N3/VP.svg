 y2="367.2891"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="492" y="362.4326">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50" x="503" y="362.4326">resposta</text><polygon fill="#181818" points="126,393.6406,116,397.6406,126,401.6406,122,397.6406" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="120" x2="469" y1="397.6406" y2="397.6406"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="132" y="392.7842">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50" x="150" y="392.7842">resposta</text><!--MD5=[2f4787e80efcd81be2b1e0a82f9ea509]
@startuml
autonumber

participant RouteEdificio as route
participant "dto: CriarEdificioDTO" as dto
participant "controller: EdificioController" as ctrl
participant "service: CriarEdificioService" as service
participant "repository: Edificio Repository" as edRepo
participant "Edificio" as ed

[o-> route: POST(json)
activate route
route -> dto ** : create(json)
route -> ctrl: criarEdificio(criarEdificioDTO)
activate ctrl
ctrl -> service: criarEdificio(criarEdificioDTO) 
activate service
service -> edRepo: verificarSeEdificioExiste(codigo)
activate edRepo
return false
service -> ed** : create(nome, x, y, descricao, codigo)
service -> edRepo: save(edificio)
activate edRepo
deactivate edRepo
return resposta
return resposta













@enduml


3" x2="161.5" y1="480.7891" y2="480.7891"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="41" x="8" y="492.208">["Erro"]</text><polygon fill="#181818" points="11,513.9766,1,517.9766,11,521.9766,7,517.9766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="5" x2="97" y1="517.9766" y2="517.9766"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="17" y="513.1201">14</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24" x="35" y="513.1201">Erro</text><!--MD5=[a7bb74b8108e02ccead45be1e46ee284]
@startuml
autonumber

participant RouteEdificio as route
participant "controller: EdificioController" as ctrl
participant "dto: ListarEdMinEMaxPisosDTO" as dto
participant "service: EdificioService" as service
participant "EdificioRepo" as edRepo
participant "Edificio" as edificio
participant "EdificioMap" as edificioMap



[o-> route: Get(json)
activate route
route -> ctrl: listarEdificioMinEMaxPisos(Request, Response, Next)
activate ctrl
ctrl -> dto ** : create(json)
ctrl -> service: listarEdificioMinEMaxPisos(listarEdMinEMaxPisosDTO) 
activate service
service -> edRepo: getAllEdificios()
activate edRepo
return listaEdificios
service -> edificio :  verificaNumeroDePisosEstaDentroDoLimite(min,max)
activate edificio
return flag
service -> edificioMap: toDTO(edificio)
activate edificioMap
return edificioDTO
return resposta
return resposta
alt
<- - route: Ok
else "Erro"
<- - route: Erro
end alt














@enduml


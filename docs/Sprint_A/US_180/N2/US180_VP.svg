f" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="17" y="245.3076">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24" x="28" y="245.3076">Erro</text><!--MD5=[11bf39fb464fef10cf99d2a4ab55ae21]
@startuml
autonumber

participant MDRoboISEP as sistema <<Container (C4)>>
participant SGBD as sgdb <<Container>>

[o-> sistema: listar edificios com minimo e maximo pisos e insere a informação (min, max)
activate sistema
sistema	-> sgdb: getAllEdificios()
activate sgdb   
return listaEdificios
alt
<- - sistema: Ok
else "Erro"
<- - sistema: Erro
end alt


 
@enduml


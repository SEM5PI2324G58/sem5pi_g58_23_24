8;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="171" x2="351" y1="390.6016" y2="390.6016"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="183" y="385.7451">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119" x="201" y="385.7451">listaDispositivosDTO</text><polygon fill="#181818" points="16.5,416.9531,6.5,420.9531,16.5,424.9531,12.5,420.9531" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="14.5" x2="160" y1="420.9531" y2="420.9531"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="17" y="416.0967">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119" x="35" y="416.0967">listaDispositivosDTO</text><!--MD5=[ccfa9b0daba866ff3f64fe13a71c620e]
@startuml
autonumber

participant "route: \n dispositivoRoute" as route
participant "controller: \n dispositivoController" as ctrl
participant "service: \n dispositivoService" as service
participant "repo: \n dispositivoRepo" as disRepo
participant "dto: \n dispositivoMapper" as mapper
participant "dto: \n dispositivoDTO" as dto

[o-> route: GET()
activate route
route -> ctrl: listarDispositivosDaFrota()
activate ctrl
ctrl -> service: listarDispositivosDaFrota() 
activate service
service -> disRepo: findAll()
activate disRepo
return listaDispositivos
service -> mapper : toDTO(dispositivo)
activate mapper
mapper -> dto ** : dispositivo
return dispositivoDTO
return listaDispositivosDTO
return listaDispositivosDTO
return listaDispositivosDTO













@enduml


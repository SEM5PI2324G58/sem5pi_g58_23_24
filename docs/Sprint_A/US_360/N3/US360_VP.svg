28"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="17" y="634.5264">18</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24" x="35" y="634.5264">Erro</text><!--MD5=[f04c6e871f28b8d061e8274864adc423]
@startuml
autonumber

participant RouteEdificio as route
participant "controller: DispositivoController" as ctrl
participant "dto: AdicionarRoboAFrota" as dto
participant "service: DispositivoService" as service
participant "TipoDispositivoRepo" as tipoRepo
participant "DispositivoRepo" as disRepo
participant "Dispositivo" as dispositivo
participant "DispositivoMap" as disMap

[o-> route: Post(json)
activate route
route -> ctrl: adicionarDispositivoAFrota(Request, Response, Next)
activate ctrl
ctrl -> dto ** : create(json)
ctrl -> service: adicionarDispositivoAFrota(listarEdMinEMaxPisosDTO) 
activate service
service -> tipoRepo: findByDomainId(tipoDispositivo)
activate tipoRepo
return tipoDispositivo
service -> disRepo: findAllDispositivo()
activate disRepo
return listaDispositivos

service - -> dispositivo: verificaSeNumeroDeSerieEIgual(numeroDeSerie)
activate dispositivo
return flag

service -> dispositivo: create(numeroDeSerie, tipoDispositivo, descricaoDispositivo, nickname, codigo, estadoDispositivo)
activate dispositivo
return dispositivo
service -> disMap: toDTO(dispositivo)
activate disMap
return dispositivoDTO
return resposta
return resposta
alt
<- - route: Ok
else "Erro"
<- - route: Erro
end alt














@enduml


@startuml
autonumber

title <<Container (C4)>> MDTarefas

participant "Controller" as ctrl
participant "Service" as service
participant "Model" as domain
participant "Repository" as repo


[o-> ctrl: PUT(json)
activate ctrl
ctrl -> service: alterarDadosUser(userDTO) 
activate service
service -> repo : getById(idUser)
activate repo
return user
service -> domain : updateDados(newDados)
activate domain
deactivate domain
service -> repo : save(user)
activate repo
deactivate repo
return resposta
return resposta












@enduml


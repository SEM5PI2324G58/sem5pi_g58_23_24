ing" textLength="14" x="17" y="555.7295">15</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24" x="35" y="555.7295">Erro</text><!--MD5=[4623cc1f666c31b7a1efccd9ab821464]
@startuml
autonumber

participant userRoute as route
participant "controller: UserContoller" as ctrl
participant "dto: SignupUtenteDTO" as dto
participant "service: UserService" as service
participant "UserRepo" as userRepo
participant "User" as user

[o-> route: POST(json)
activate route
route -> ctrl: signupUtente(Request, Response, Next)
activate ctrl
ctrl -> dto ** : create(json)
ctrl -> service: signupUtente(signupUtenteDTO) 
activate service
service -> userRepo: findByEmail(email)
activate userRepo
return user
service -> userRepo: maxId()
activate userRepo
return userId
service -> user ** : create(userProps)
service -> userRepo: save(user)
return resposta
alt
route <- - ctrl: Ok
<- - route: Ok
else "Erro"
route <- - ctrl: Erro
deactivate ctrl
<- - route: Erro
end alt
deactivate route












@enduml


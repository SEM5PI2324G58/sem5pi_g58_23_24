8ea7062a0aa4ee]
@startuml
autonumber

participant userRoute as route
participant "controllerS" as ctrl
participant "dto" as dto
participant "ImplServices" as service
participant "repos" as userRepo
participant "domain" as user

[o-> route: POST(json)
activate route
route -> ctrl: signupUtente(Request, Response, Next)
activate ctrl
ctrl -> dto ** : create(json)
ctrl -> service: signupUtente(signupUtenteDTO) 
activate service
service -> userRepo: findByEmail(email)
activate userRepo
return user
service -> userRepo: maxId()
activate userRepo
return userId
service -> user ** : create(userProps)
service -> userRepo: save(user)
return resposta
alt
route <- - ctrl: Ok
<- - route: Ok
else "Erro"
route <- - ctrl: Erro
deactivate ctrl
<- - route: Erro
end alt
deactivate route












@enduml


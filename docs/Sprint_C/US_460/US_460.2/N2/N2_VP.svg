 fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="83" y="322.5654">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50" x="94" y="322.5654">resposta</text><!--MD5=[c2f2fb97a0db7e845741ddd871acae1f]
@startuml
autonumber

actor "Gestor de Tarefas" as actor
participant SPA as fe <<Container (C4)>>
participant MDTarefas as mdT <<Container (C4)>>
participant Planeamento as plan <<Container (C4)>>
participant Auth as auth <<Container (C4)>>

actor -> fe: informação de criação da tarefa
activate fe
fe	-> mdT: criarTarefa(tarefaDataModel)
activate mdT
mdT	-> plan: GET obterPercurso(percursoDTO)
activate plan
return resposta
mdT -> auth: GET obterEmailUserAtual()
activate auth
return resposta
return resposta
return resposta


 
 
@enduml


 lengthAdjust="spacing" textLength="14" x="17" y="437.2295">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50" x="35" y="437.2295">resposta</text><!--MD5=[daef731b1f7187c8b2074158dc60a46f]
@startuml
autonumber

title <<Container (C4)>> MDTarefas

participant "Controller" as ctrl
participant "Service" as service
participant "Repository" as repo
participant "Domain" as domain


[o-> ctrl: POST(json)
activate ctrl
ctrl -> service: criarTarefa(tarefaDTO) 
activate service
service ->o] : GET obterPercurso(percursoDTO)
service <- - : resposta
service ->o] : GET obterEmailUserAtual()
service <- - : resposta
service -> domain : criarTarefa(propsTarefa)
activate domain
return newTarefa
service -> repo : save(newTarefa)
activate repo
deactivate repo
return resposta
return resposta












@enduml


@startuml
autonumber

actor "Gestor de Tarefas" as actor
participant SPA as fe <<Container (C4)>>
participant MDTarefas as mdT <<Container (C4)>>

actor -> fe: Manda um pedido para o MDtarefas com o algoritmo que deseja usar
activate fe
fe	-> mdT: carregarTarefasNoPlaneamento(algoritmo)
activate mdT
return resposta
return resposta
@enduml

